name: Daily Dev Log

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update daily log
        run: |
          mkdir -p daily
          date=$(date -u +"%Y-%m-%d")

          cat > "daily/$date.md" <<EOF
          # Daily Development Log — $date

          ## Activity

          Daily development activity.

          ## Status

          - Automated log generated by GitHub Actions.
          - No manual entry required.
          EOF

      - name: Commit changes
        run: |
          git config user.name "Saturiaaa."
          git config user.email "kurniawannsatria@gmail.com"

          git add daily/

          git diff --cached --quiet || \
            git commit -m "docs: daily development log"

          git push
